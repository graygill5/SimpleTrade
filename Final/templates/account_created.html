<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Account created — SimpleTrade</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;1,9..40,400&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg0: #070a12;
            --bg1: #0f172a;
            --accent: #10b981;
            --accent-dim: rgba(16, 185, 129, 0.15);
            --text: #f8fafc;
            --muted: #94a3b8;
            --card: rgba(255, 255, 255, 0.04);
            --border: rgba(255, 255, 255, 0.08);
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            min-height: 100vh;
            font-family: "DM Sans", system-ui, sans-serif;
            background: radial-gradient(ellipse 80% 50% at 50% -20%, rgba(59, 130, 246, 0.25), transparent),
                linear-gradient(165deg, var(--bg0), var(--bg1) 45%, #0c1222);
            color: var(--text);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
        }
        .shell {
            width: 100%;
            max-width: 440px;
            text-align: center;
        }
        .icon-wrap {
            width: 88px;
            height: 88px;
            margin: 0 auto 28px;
            border-radius: 50%;
            background: var(--accent-dim);
            border: 1px solid rgba(16, 185, 129, 0.35);
            display: flex;
            align-items: center;
            justify-content: center;
            animation: pop 0.55s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
        }
        @keyframes pop {
            from { opacity: 0; transform: scale(0.85); }
            to { opacity: 1; transform: scale(1); }
        }
        .icon-wrap svg { width: 44px; height: 44px; color: var(--accent); }
        h1 {
            font-size: 1.75rem;
            font-weight: 700;
            letter-spacing: -0.02em;
            margin-bottom: 12px;
        }
        .username {
            display: inline-block;
            margin-top: 4px;
            padding: 6px 14px;
            border-radius: 999px;
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid var(--border);
            font-weight: 600;
            font-size: 0.95rem;
            color: #e2e8f0;
        }
        .lead {
            color: var(--muted);
            font-size: 1rem;
            line-height: 1.65;
            margin: 20px 0 32px;
        }
        .actions {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            padding: 14px 22px;
            border-radius: 12px;
            font-size: 0.95rem;
            font-weight: 600;
            text-decoration: none;
            transition: transform 0.15s ease, box-shadow 0.15s ease;
        }
        .btn-primary {
            background: linear-gradient(135deg, #2563eb, #1d4ed8);
            color: white;
            border: none;
            box-shadow: 0 8px 24px rgba(37, 99, 235, 0.35);
        }
        .btn-primary:hover {
            transform: translateY(-1px);
            box-shadow: 0 12px 28px rgba(37, 99, 235, 0.4);
        }
        .btn-ghost {
            background: var(--card);
            color: var(--muted);
            border: 1px solid var(--border);
        }
        .btn-ghost:hover {
            color: var(--text);
            border-color: rgba(255, 255, 255, 0.14);
        }
        .fine {
            margin-top: 28px;
            font-size: 0.8rem;
            color: #64748b;
        }
    </style>
</head>
<body>
    <div class="shell">
        <div class="icon-wrap" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/>
                <polyline points="22 4 12 14.01 9 11.01"/>
            </svg>
        </div>
        <h1>You’re all set</h1>
        {% if username %}
        <p><span class="username">{{ username }}</span></p>
        {% endif %}
        <p class="lead">
            Your SimpleTrade account is ready. Sign in with your new credentials to open your workspace.
        </p>
        <div class="actions">
            <a class="btn btn-primary" href="/?tab=login">Sign in now</a>
            <a class="btn btn-ghost" href="/">Back to home</a>
        </div>
        <p class="fine">Tip: use the same username and password you just created.</p>
    </div>
</body>
</html>
